# The DAWO app catalogue (ADR 0008, docs/adr/0008-dawo-apps.md).
#
# One [[app]] entry per app that `dawo-app` can start. The app itself is
# described in <path>/app.toml (format: apps/README.md). Ids are the
# product's own name, lowercase, words joined by hyphens, and never change.
# An appliance release freezes this file and every app.toml it points to.

schema = 1

[[app]]
id = "mijn-bureau"
path = "mijn-bureau"
