name: Fout melden / Bug report
description: Something does not work as described. Not for security problems (see SECURITY.md).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Dank je! Beveiligingsproblemen niet hier melden, maar via SECURITY.md.
        Thanks! Do not report security problems here; see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Versie / Version
      description: From the boot menu or the status page footer, e.g. "0.1.0-rc.1 (8a49174)".
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Laptop model, memory, USB SSD or stick.
  - type: dropdown
    id: environment
    attributes:
      label: Omgeving / Environment
      options:
        - De werkplek zelf / the workplace itself
        - De Launcher
        - Mijn Bureau
        - Valtimo
        - Nextcloud Common Ground
        - Tezza
        - Anders / other
  - type: textarea
    id: what
    attributes:
      label: Wat gebeurde er? / What happened?
      description: What you did, what you expected, what you saw. Screenshots welcome.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "If you have them, from the session folder on DAWO_LOGS (dawo-appliance/<date_time>/): progress.txt, rondgang.txt and per environment mijnbureau.txt, valtimo.txt, nextcloud-commonground.txt or tezza.txt. Remove anything private first."
